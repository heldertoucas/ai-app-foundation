<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliação Dashboard — Zero-Build Cockpit</title>
  
  <!-- 1. Tokens Canónicos DU (1:1 com globals.css) -->
  <link rel="stylesheet" href="../../core/tokens.css">
  
  <!-- 2. shadcn-html Core Components Bundle -->
  <link rel="stylesheet" href="../../core/vendor/shadcn-html.all.css">
  
  <!-- 3. Componentes Próprios DU (KPI, Telemetria, Bento) -->
  <link rel="stylesheet" href="../../core/du-components.css">
  
  <!-- 4. Micro-Runtime (<50 LOC) -->
  <script src="../../core/du-runtime.js" defer></script>

  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-background text-foreground">

  <main id="app-root" class="du-container" data-blueprint="cockpit" data-kit="avaliacao">
    <!-- Ecrã Inicial de Autenticação (Montado diretamente) -->
    <div class="x-s1" id="auth-screen">
      <div class="x-s2"><svg class="du-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg></div>
      <h1 class="x-s3">Cockpit de Avaliação e Pauta</h1>
      <p class="x-s4">Template Zero-Build com Paridade Canónica DU</p>

      <div class="du-card x-s5" data-region="gate">
        <!-- Abas Formador / Admin -->
        <div class="x-s6">
          <button class="ui-btn ui-btn-secondary x-s7" id="tab-trainer-btn" data-du-on-click="[[&quot;switchAuthTab&quot;,[&quot;trainer&quot;]]]">Formador (PIN)</button>
          <button class="ui-btn ui-btn-ghost x-s8" id="tab-admin-btn" data-du-on-click="[[&quot;switchAuthTab&quot;,[&quot;admin&quot;]]]">Admin (Password)</button>
        </div>

        <div class="x-s9" id="lockout-alert">
          Tentativas excedidas. Bloqueio ativo por <strong id="lockout-timer">60</strong>s.
        </div>

        <div class="x-s10" id="error-alert"></div>

        <!-- Form Formador -->
        <div id="trainer-auth-form">
          <label class="x-s11">Código de Turma</label>
          <input class="ui-input x-s12" id="action-code-input" type="text" value="FD-2026-TURMA4" />

          <div class="x-s13">
            <label class="x-s11">PIN de 4 Dígitos</label>
            <span class="x-s14">Demo: 1234</span>
          </div>

          <div class="pin-display">
            <div class="pin-dot" id="dot-0"></div>
            <div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div>
          </div>

          <div class="pin-keypad">
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;1&quot;]]]">1</button>
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;2&quot;]]]">2</button>
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;3&quot;]]]">3</button>
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;4&quot;]]]">4</button>
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;5&quot;]]]">5</button>
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;6&quot;]]]">6</button>
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;7&quot;]]]">7</button>
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;8&quot;]]]">8</button>
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;9&quot;]]]">9</button>
            <button class="pin-btn x-s15" data-du-on-click="[[&quot;clearPin&quot;,[]]]">Limpar</button>
            <button class="pin-btn" data-du-on-click="[[&quot;pressPin&quot;,[&quot;0&quot;]]]">0</button>
            <button class="pin-btn x-s16" data-du-on-click="[[&quot;backspacePin&quot;,[]]]">⌫</button>
          </div>

          <button class="ui-btn x-s17" id="submit-trainer-btn" data-du-on-click="[[&quot;validateTrainerPin&quot;,[]]]">
            Entrar no Painel do Formador
          </button>
        </div>

        <!-- Form Admin -->
        <div class="x-s18" id="admin-auth-form">
          <div class="x-s19">
            <label class="x-s11">Password Mestra</label>
            <span class="x-s14">Demo: admin123</span>
          </div>
          <input class="ui-input x-s20" id="admin-pass-input" type="password" placeholder="••••••••••••" />

          <button class="ui-btn x-s17" id="submit-admin-btn" data-du-on-click="[[&quot;validateAdminPassword&quot;,[]]]">
            Aceder ao Cockpit Administrativo
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- DEFERRED DOM TEMPLATE (Não pré-renderizado no DOM ativo contra devtools bypass) -->
  <template id="dashboard-view-template">
    <div id="dashboard-content" data-region="content">
      <!-- Session Header -->
      <header class="du-header" data-region="topbar">
        <div class="du-flex-row">
          <div class="x-s21"><svg class="du-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg></div>
          <div>
            <div class="du-flex-row">
              <h1 class="x-s22" id="view-title">Painel de Avaliação</h1>
              <span id="role-badge" class="ui-badge ui-badge-secondary font-mono">FD-2026-TURMA4</span>
            </div>
            <p class="x-s23" id="view-subtitle">Mesa de trabalho do formador</p>
          </div>
        </div>

        <div class="du-flex-row">
          <div class="du-telemetry-pill du-status-live">
            <span class="du-ping-dot"><span class="du-ping-circle"></span><span class="du-ping-core"></span></span>
            <span class="x-s24" id="live-clock">--:--:--</span>
          </div>

          <button class="ui-btn ui-btn-outline x-s15" id="toggle-view-btn" data-du-on-click="[[&quot;toggleViewMode&quot;,[]]]">Alternar Visão</button>
          <button class="ui-btn ui-btn-ghost x-s25" data-du-on-click="[[&quot;logout&quot;,[]]]">Terminar Sessão</button>
        </div>
      </header>

      <!-- KPI Summary Cards -->
      <div class="du-grid-4" data-region="summary">
        <div class="du-card">
          <div class="x-s26">Total de Formandos</div>
          <div class="x-s27" id="kpi-total">10</div>
          <div class="x-s28">Turma Completa</div>
        </div>
        <div class="du-card">
          <div class="x-s26">Em Prova Ativa</div>
          <div class="x-s29" id="kpi-in-progress">3</div>
          <div class="x-s28">Tempo a decorrer</div>
        </div>
        <div class="du-card">
          <div class="x-s26">Submetidos</div>
          <div class="x-s30" id="kpi-completed">5</div>
          <div class="x-s28">Provas concluídas</div>
        </div>
        <div class="du-card">
          <div class="x-s26">Taxa Média Sucesso</div>
          <div class="x-s29" id="kpi-approval">100%</div>
          <div class="x-s28" id="kpi-avg-score">Média: 17.6 / 20</div>
        </div>
      </div>

      <!-- Secção de Telemetria (Visível no Admin ou quando alternado) -->
      <div class="x-s31" id="admin-telemetry-section">
        <div class="x-s32">
          <div>
            <h2 class="x-s33">Sincronizações Externas</h2>
            <p class="x-s34">Google Sheets Pauta Sync &amp; Neon DB Wal Cache</p>
          </div>
          <button class="ui-btn x-s8" id="sync-now-btn" data-du-on-click="[[&quot;triggerSync&quot;,[]]]">Forçar Sincronização</button>
        </div>

        <div class="du-grid-3">
          <div class="du-card">
            <div class="x-s35">
              <strong class="x-s36">Google Sheets Pauta Sync</strong>
              <span class="badge-live">Live</span>
            </div>
            <p class="x-s37">Spreadsheet ID: 1A...k8 | Folha "Resultados-2026"</p>
            <div class="x-s38">
              <span class="x-s39">Latência:</span>
              <strong class="x-s40" id="sheets-latency">142 ms</strong>
            </div>
          </div>

          <div class="du-card">
            <div class="x-s35">
              <strong class="x-s36">Neon DB / WAL Cache</strong>
              <span class="badge-live">Live</span>
            </div>
            <p class="x-s37">Pool ativo: 4/20 ligações | Conexões SSL</p>
            <div class="x-s38">
              <span class="x-s39">Latência:</span>
              <strong class="x-s40" id="db-latency">18 ms</strong>
            </div>
          </div>

          <div class="du-card">
            <div class="x-s35">
              <strong class="x-s36">CMLisboa Auth API Quota</strong>
              <span class="badge-live">Live</span>
            </div>
            <p class="x-s37">Quota diária de validação de NIF</p>
            <div class="x-s38">
              <span class="x-s39">Consumo:</span>
              <strong class="x-s40">38%</strong>
            </div>
          </div>
        </div>
      </div>

      <!-- Secção da Tabela de Formandos -->
      <div id="trainer-table-section">
        <div class="x-s41">
          <input class="ui-input x-s42" id="table-search-input" type="text" placeholder="Pesquisar formando por nome, NIF ou ID..." data-du-on-input="[[&quot;onSearchInput&quot;,[]]]" />
          <div class="x-s43">
            <button class="ui-btn ui-btn-outline x-s8" data-du-on-click="[[&quot;exportCsv&quot;,[]]]">Exportar Pauta (CSV)</button>
          </div>
        </div>

        <div class="table-container">
          <table class="du-table" id="trainees-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome do Formando</th>
                <th>NIF</th>
                <th>Estado</th>
                <th>Hora Início</th>
                <th>Questões</th>
                <th class="x-s44">Nota</th>
                <th class="x-s44">Ação</th>
              </tr>
            </thead>
            <tbody id="trainees-tbody">
              <!-- Renderizado dinamicamente via safe DOM injection -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <script src="index.js"></script>
</body>
</html>
